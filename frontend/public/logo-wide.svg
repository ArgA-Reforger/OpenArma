<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGradHoriz" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#A1A5AC" />
      <stop offset="100%" stop-color="#24272D" />
    </linearGradient>
    <mask id="logoMaskHoriz">
      <rect width="400" height="400" fill="white" />
      <rect x="0" y="125" width="400" height="20" fill="black" />
      <rect x="188" y="250" width="24" height="100" fill="black" />
    </mask>
  </defs>

  <g transform="translate(40, 20) scale(0.4)">
    <path d="M 100 200 A 100 100 0 0 0 300 200 L 200 40 Z" 
          fill="none" 
          stroke="url(#logoGradHoriz)" 
          stroke-width="48" 
          stroke-linejoin="round" 
          mask="url(#logoMaskHoriz)" />
  </g>

  <text x="220" y="114" font-family="system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#24272D" letter-spacing="3">
    OPEN<tspan font-weight="300" fill="#71757D">ARMA</tspan>
  </text>
  
  <rect x="225" y="125" width="320" height="2" fill="#E5E7EB" />
</svg>