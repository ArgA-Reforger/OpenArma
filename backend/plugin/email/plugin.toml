[plugin]
summary = "Correo electrónico"
version = "0.0.3"
description = "Proporciona la función de envío de correos, compatible con códigos de verificación, notificaciones y otros casos de uso"
author = "wu-clan"
tags = ["other"]
database = ["mysql", "postgresql"]

[app]
router = ["v1"]

[settings]
EMAIL_CAPTCHA_EXPIRE_SECONDS = 180  # 3 分钟
EMAIL_CAPTCHA_REDIS_PREFIX = "fba:email:captcha"
EMAIL_HOST = "smtp.qq.com"
EMAIL_PORT = 465
EMAIL_SSL = true
