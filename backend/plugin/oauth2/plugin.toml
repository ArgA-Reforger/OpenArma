[plugin]
summary = "OAuth 2.0"
version = "0.0.11"
description = "Permite iniciar sesión mediante plataformas sociales como GitHub y Google"
author = "wu-clan"
tags = ["auth"]
database = ["mysql", "postgresql"]

[app]
router = ["v1"]

[settings]
OAUTH2_FRONTEND_BINDING_REDIRECT_URI = "https://openarma.com/profile"
OAUTH2_FRONTEND_LOGIN_REDIRECT_URI = "https://openarma.com/oauth2/callback"
OAUTH2_GITHUB_REDIRECT_URI = "https://openarma.com/api/v1/oauth2/github/callback"
OAUTH2_GOOGLE_REDIRECT_URI = "https://openarma.com/api/v1/oauth2/google/callback"
OAUTH2_STATE_EXPIRE_SECONDS = 180  # 3 分钟
OAUTH2_STATE_REDIS_PREFIX = "fba:oauth2:state"
