# ============================================================================
# Grafana Data Sources Provisioning Configuration File
# Official docs: https://grafana.com/docs/grafana/latest/administration/provisioning/#datasources
# Used to automatically configure data sources, enabling infrastructure as code
# ============================================================================

# API version
# Currently only version 1 is supported
apiVersion: 1

# Data sources list
datasources:
  # ==========================================================================
  # Loki data source configuration
  # Loki is Grafana's log aggregation system, similar to Prometheus but for logs
  # Official docs: https://grafana.com/docs/loki/latest/
  # ==========================================================================
  - name: Loki
    uid: loki
    type: loki
    url: http://fba_loki:3100
    isDefault: false
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"traceid":"([a-f0-9]{32})"'
          matcherType: regex
          name: TraceID
          url: $${__value.raw}
          urlDisplayLabel: View Trace

  # ==========================================================================
  # Prometheus data source configuration
  # Prometheus is a cloud-native monitoring system for collecting and
  # storing time-series metrics
  # Official docs: https://prometheus.io/docs/
  # ==========================================================================
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://fba_prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: TraceID
          datasourceUid: tempo

  # ==========================================================================
  # Tempo data source configuration
  # Tempo is Grafana's distributed tracing backend
  # Official docs: https://grafana.com/docs/tempo/latest/
  # ==========================================================================
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://fba_tempo:3200
    jsonData:
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        customQuery: true
        query: '{service_name="fba_server"} | json | traceid="${__span.traceId}"'
      search:
        hide: false
      serviceMap:
        datasourceUid: prometheus
      lokiSearch:
        datasourceUid: loki
