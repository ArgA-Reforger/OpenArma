# ============================================================================
# Grafana Dashboards Provisioning Configuration File
# Official docs: https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards
# Used to automatically load and manage dashboards without manual import
# ============================================================================

# API version
# Currently only version 1 is supported
apiVersion: 1

# List of dashboard providers
providers:
  - name: 'fba_server'
    orgId: 1
    type: 'file'
    disableDeletion: true
    editable: false
    options:
      path: '/etc/grafana/dashboards'
