# ============================================================================
# Tempo configuration file
# Tempo is Grafana's high-performance, cost-effective distributed tracing
# backend
# Official docs: https://grafana.com/docs/tempo/latest/configuration/
# ============================================================================

# HTTP server configuration
server:
  http_listen_port: 3200

# Distributor configuration
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

# Storage configuration
storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

# Metrics generator configuration
metrics_generator:
  registry:
    external_labels:
      source: tempo

  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://fba_prometheus:9090/api/v1/write
        send_exemplars: true

  processor:
    span_metrics:
      dimensions:
        - service.name
        - http.method
        - http.target
        - http.status_code
    service_graphs:
      dimensions:
        - service.name

# Overrides configuration
overrides:
  defaults:
    metrics_generator:
      processors:
        - span-metrics
        - service-graphs
